# Local development only - production runs in k3s via Flux (meklab/k8s).
# Usage: docker compose up -d db && uv run python manage.py migrate && uv run python manage.py runserver
services:
  db:
    image: postgres:17.5
    environment:
      POSTGRES_DB: yardwise
      POSTGRES_USER: yardwise
      POSTGRES_PASSWORD: yardwise-dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
