{% if sources %}
<div class="ai-sources">
  <span class="meta">Sources:</span>
  {% for src in sources %}
    <a href="{{ src.url }}" target="_blank" rel="noopener noreferrer"
       title="{{ src.title }}">{{ src.label|default:src.title|truncatechars:36 }}</a>{% if not forloop.last %}<span aria-hidden="true">·</span>{% endif %}
  {% endfor %}
</div>
{% endif %}
