<div class="row" id="occ-{{ occ.pk }}" style="opacity:0.65">
  <div class="grow">
    <div class="title" style="text-decoration:line-through">{{ occ.task.title }}</div>
    <div class="meta">
      {% if occ.status == "completed" %}Done today{% else %}Skipped{% endif %}
      {% if occ.task.schedule_kind != "exact_once" and occ.task.schedule_kind != "window_once" %}
        · next one scheduled
      {% endif %}
    </div>
  </div>
  <span class="chip">✓</span>
</div>
